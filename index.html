<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astral SMP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0015;color:white;font-family:sans-serif;padding:15px;min-height:100vh;position:relative;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,#1a0a33 0%,#2a0a4a 30%,#4a148c 60%,#0a0015 100%)}
.blob{position:fixed;border-radius:50%;filter:blur(50px);opacity:0.6;animation:float 8s infinite ease-in-out}
.b1{width:300px;height:300px;background:radial-gradient(circle,#a855f7,#7c3aed);top:-50px;left:-50px;animation-delay:0s}
.b2{width:400px;height:400px;background:radial-gradient(circle,#ec4899,#a855f7);bottom:-100px;right:-80px;animation-delay:2s}
.b3{width:250px;height:250px;background:radial-gradient(circle,#6366f1,#4f46e5);top:40%;left:60%;animation-delay:4s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-30px) scale(1.2)}}
.header{text-align:center;margin:25px 0 15px;position:relative}
.header h1{font-size:46px;font-weight:900;color:#d8b4fe;letter-spacing:6px;text-shadow:0 0 20px #a855f7,0 0 40px #7c3aed,0 0 80px #a855f7}
.warn-big{max-width:650px;margin:15px auto;background:linear-gradient(90deg,#7f1d1d,#b91c1c);border:2px solid #f87171;border-radius:14px;padding:16px;text-align:center;font-size:15px;font-weight:900;color:white;box-shadow:0 0 30px rgba(239,68,68,0.7);animation:pulse 1s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 40px rgba(239,68,68,1);transform:scale(1.02)}}
.notice{max-width:500px;margin:10px auto;background:rgba(168,85,247,0.2);border:1px dashed #a855f7;border-radius:30px;padding:8px;text-align:center;font-size:11px;color:#e9d5ff;backdrop-filter:blur(10px)}
.tabs{max-width:380px;margin:18px auto;display:flex;gap:10px}
.tab-btn{flex:1;padding:14px;border-radius:14px;border:1px solid #4c1d95;background:rgba(20,10,40,0.8);color:#9ca3af;font-weight:800;cursor:pointer}
.tab-btn.active{background:linear-gradient(90deg,#7c3aed,#a855f7);color:white;box-shadow:0 0 20px #a855f7}
.list-container{display:none;max-width:650px;margin:0 auto;flex-direction:column;gap:16px}
.list-container.active{display:flex}
.kit-row{display:flex;align-items:center;gap:18px;background:rgba(18,12,40,0.85);border:1px solid #4c1d95;border-radius:20px;padding:22px;backdrop-filter:blur(12px);cursor:pointer;transition:0.2s;position:relative}
.kit-row::before{content:'';position:absolute;left:0;top:0;width:5px;height:100%;background:var(--accent);border-radius:20px 0 0 20px;box-shadow:0 0 15px var(--accent)}
.kit-row:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 10px 30px rgba(168,85,247,0.3);border-color:var(--accent)}
.kit-row:active{transform:scale(0.96)}
.kit-icon{width:70px;height:70px;background:#0f0a1e;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:36px;flex-shrink:0;border:1px solid #2d1b4e;box-shadow:0 0 20px var(--accent)}
.kit-info{flex:1}
.kit-name{font-weight:900;font-size:17px;letter-spacing:1px}
.kit-desc{font-size:12px;color:#9ca3af;margin:4px 0}
.kit-stats{font-size:11px;color:#c4b5fd}
.kit-price{text-align:right}
.price-num{font-size:24px;font-weight:900}
.price-usd{font-size:10px;color:#6b7280}
.btn-buy{background:var(--accent);color:white;border:none;padding:10px 16px;border-radius:10px;font-weight:800;font-size:12px;margin-top:6px;cursor:pointer}
.ip-footer{max-width:650px;margin:45px auto 10px;background:rgba(20,10,40,0.9);border:1px solid #7c3aed;border-radius:18px;padding:18px;backdrop-filter:blur(15px);text-align:center}
.ip-line{display:flex;justify-content:space-between;align-items:center;background:#0a0015;padding:14px;border-radius:12px;margin-top:10px;border:1px solid #2d1b4e}
.ip-text{font-family:monospace;font-weight:900;font-size:14px}
/* MODAL PREVIEW */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);z-index:999;align-items:center;justify-content:center;padding:20px}
.modal.active{display:flex}
.modal-box{background:linear-gradient(180deg,#1e1438,#120b25);border:2px solid var(--accent,#a855f7);border-radius:20px;padding:25px;max-width:380px;width:100%;text-align:center;box-shadow:0 0 40px var(--accent);animation:pop 0.3s}
@keyframes pop{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal-icon{font-size:70px;filter:drop-shadow(0 0 20px var(--accent));margin-bottom:10px}
.modal-title{font-size:26px;font-weight:900;letter-spacing:2px;margin:10px 0}
.modal-list{text-align:left;margin:15px 0;background:rgba(0,0,0,0.3);border-radius:12px;padding:12px}
.modal-item{padding:8px 0;border-bottom:1px solid #1f1838;font-size:13px;color:#d1c7ff;display:flex;gap:8px}
.btn-close{width:100%;padding:14px;background:var(--accent);color:white;border:none;border-radius:12px;font-weight:900;margin-top:10px;cursor:pointer}
.btn-discord{width:100%;padding:14px;background:#5865F2;color:white;border:none;border-radius:12px;font-weight:900;margin-top:8px;display:block;text-align:center;text-decoration:none}
</style>
</head>
<body>
<div class="bg"></div>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<div class="header"><h1>ASTRAL SMP</h1><p style="color:#a78bfa;font-size:11px;letter-spacing:4px">TEMPORADA 3</p></div>

<div class="warn-big">⛔ LOS RANGOS SOLO SE HACEN CON JEREKLEIN ⛔<br><span style="font-size:11px;font-weight:400">No pagues a nadie más, es estafa</span></div>

<div class="notice">⏳ Los rangos duran un máximo de 2 temporadas</div>

<div class="tabs">
<button class="tab-btn active" onclick="showTab('rangos',this)">RANGOS</button>
<button class="tab-btn" onclick="showTab('unban',this)">UNBANS</button>
</div>

<div id="rangos" class="list-container active"></div>
<div id="unban" class="list-container"></div>

<div class="ip-footer">
<div style="color:#a855f7;font-weight:800;font-size:12px;letter-spacing:2px">ASTRAL SMP - TEMPORADA 3</div>
<div class="ip-line"><span class="ip-text" id="ip">209.133.215.154</span><button class="btn-buy" style="background:#7c3aed" onclick="copyTxt('ip')">COPIAR IP</button></div>
<div class="ip-line"><span class="ip-text" id="port">50063</span><button class="btn-buy" style="background:#7c3aed" onclick="copyTxt('port')">COPIAR PUERTO</button></div>
</div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="if(event.target==this)closeModal()">
<div class="modal-box" id="modalBox" style="--accent:#a855f7">
<div class="modal-icon" id="mIcon">👑</div>
<div class="modal-title" id="mTitle">PERSONALIZADO</div>
<div style="color:#34d399;font-size:12px;font-weight:700" id="mSub">Kit Personalizado</div>
<div style="font-size:32px;font-weight:900;margin:10px 0" id="mPrice">$25 USD</div>
<div class="modal-list" id="mList"></div>
<a class="btn-discord" id="mDiscord" href="https://discord.gg/Py2YZaG8sW" target="_blank">COMPRAR EN DISCORD</a>
<button class="btn-close" id="mBtn" onclick="closeModal()">CERRAR</button>
</div>
</div>

<script>
const kits=[
{icon:'👑',name:'PERSONALIZADO',sub:'Kit Personalizado',price:'$25',accent:'gold',stats:['🏷️ Rango en servidor','✨ Protección a elección','⚔️ Filo a elección','⏳ Duración: máximo 2 temporadas']},
{icon:'💀',name:'ANCESTRAL',sub:'Kit Ancestral',price:'$14',accent:'#ef4444',stats:['✨ Protección 18','⚔️ Filo 18','⏱️ Kit cada 24h','💰 20M cada 24h','⏳ Duración: máximo 2 temporadas']},
{icon:'🔮',name:'MISTICO',sub:'Kit Místico',price:'$8',accent:'#a855f7',stats:['✨ Protección 16','⚔️ Filo 16','⏱️ Kit cada 24h','💰 15M cada 24h','⏳ Duración: máximo 2 temporadas']},
{icon:'🐍',name:'MEDUSA',sub:'Kit Medusa',price:'$4',accent:'#10b981',stats:['✨ Protección 14','⚔️ Filo 14','⏱️ Kit cada 24h','💰 10M cada 24h','⏳ Duración: máximo 2 temporadas']},
{icon:'🚀',name:'BOOSTER',sub:'KIT BOOSTER',price:'GRATIS',accent:'#ff41ff',stats:['🎁 CONTIENE','⏱️ Cada 24h 1 kit','✨ Protección 13','⚔️ Filo 13','💜 Gratis por boostear x2']},
];
const unbans=[
{icon:'🔓',name:'UNBAN 30 DIAS',sub:'Unban Temporal',price:'$2',accent:'#22c55e',stats:['✅ Desbaneo por 30 días','🎮 Vuelve a jugar']},
{icon:'♾️',name:'PERMANENTE',sub:'Unban Permanente',price:'$6',accent:'#06b6d4',stats:['♾️ Desbaneo para siempre','🎮 Nunca más pagas']},
];
function render(){
const rangosDiv=document.getElementById('rangos');
const unbanDiv=document.getElementById('unban');
rangosDiv.innerHTML=kits.map((k,i)=>`
<div class="kit-row" style="--accent:${k.accent}" onclick="openPreview('rango',${i})">
<div class="kit-icon" style="--accent:${k.accent}">${k.icon}</div>
<div class="kit-info"><div class="kit-name" style="color:${k.accent}">${k.name}</div><div class="kit-desc">${k.sub}</div><div class="kit-stats">${k.stats[0]} • ${k.stats[1]}</div></div>
<div class="kit-price"><div class="price-num">${k.price}</div><div class="price-usd">${k.price=='GRATIS'?'BOOST':'USD'}</div><button class="btn-buy" style="background:${k.accent};${k.accent=='gold'?'color:black':''}">${k.price=='GRATIS'?'BOOSTEAR':'VER'}</button></div>
</div>`).join('');
unbanDiv.innerHTML=unbans.map((k,i)=>`
<div class="kit-row" style="--accent:${k.accent}" onclick="openPreview('unban',${i})">
<div class="kit-icon" style="--accent:${k.accent}">${k.icon}</div>
<div class="kit-info"><div class="kit-name" style="color:${k.accent}">${k.name}</div><div class="kit-desc">${k.sub}</div><div class="kit-stats">${k.stats[0]}</div></div>
<div class="kit-price"><div class="price-num">${k.price}</div><div class="price-usd">USD</div><button class="btn-buy" style="background:${k.accent}">VER</button></div>
</div>`).join('');
}
render();
function showTab(id,btn){
document.querySelectorAll('.list-container').forEach(g=>g.classList.remove('active'));
document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
document.getElementById(id).classList.add('active');
btn.classList.add('active');
}
function copyTxt(id){
var t=document.getElementById(id).innerText;
navigator.clipboard.writeText(t);
alert('Copiado: '+t);
}
function openPreview(type,index){
const k=type=='rango'?kits[index]:unbans[index];
document.getElementById('mIcon').innerText=k.icon;
document.getElementById('mTitle').innerText=k.name;
document.getElementById('mTitle').style.color=k.accent;
document.getElementById('mSub').innerText=k.sub;
document.getElementById('mPrice').innerText=k.price+(k.price=='GRATIS'?'':' USD');
document.getElementById('modalBox').style.setProperty('--accent',k.accent);
document.getElementById('mBtn').style.background=k.accent;
document.getElementById('mDiscord').href='https://discord.gg/Py2YZaG8sW';
document.getElementById('mList').innerHTML=k.stats.map(s=>`<div class="modal-item">${s}</div>`).join('');
document.getElementById('modal').classList.add('active');
if(navigator.vibrate) navigator.vibrate(60);
}
function closeModal(){document.getElementById('modal').classList.remove('active')}
</script>
</body>
</html>
