<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astral SMP</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Inter:wght@600;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a040c;color:white;font-family:'Inter',sans-serif;padding:12px;min-height:100vh}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at top,#2e1430 0%,#140812 45%,#0a040c 100%)}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:0.45}
.b1{width:600px;height:600px;background:radial-gradient(circle,#7f1d1d,#6d28d9);top:-150px;left:-150px}
.b2{width:500px;height:500px;background:radial-gradient(circle,#a855f7,#7f1d1d);bottom:-120px;right:-100px}

.header{text-align:center;margin:20px 0 10px}
.header h1{font-family:'Black Han Sans',sans-serif;font-size:64px;line-height:0.85;text-transform:uppercase;color:#e8c5d6;text-shadow:0 4px 0 #000,0 0 20px #ff4d9e,0 0 45px #a855f7;letter-spacing:1px}
.pill{margin-top:12px;display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:30px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);font-size:11px;letter-spacing:2px;font-weight:800;color:#e5a8c8}

.tabs{max-width:520px;margin:18px auto;display:flex;gap:12px}
.tab-btn{flex:1;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,0.08);background:#1a0e1a;color:#9a8190;font-weight:800;font-size:13px;letter-spacing:1px;cursor:pointer;transition:0.2s}
.tab-btn.active{background:linear-gradient(90deg,#b91c2d,#a855f7);color:white;box-shadow:0 6px 20px rgba(168,85,247,0.35);border-color:transparent}

.list-box{max-width:520px;margin:0 auto;display:none;flex-direction:column;gap:16px}
.list-box.active{display:flex}

.card{background:linear-gradient(180deg,rgba(50,22,36,0.95),rgba(30,14,28,0.95));border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:16px;position:relative}
.card-top{display:flex;gap:14px;align-items:flex-start}
.icon{width:88px;height:88px;flex-shrink:0;background:linear-gradient(180deg,rgba(255,255,255,0.06),rgba(0,0,0,0.4));border:1px solid rgba(255,255,255,0.08);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:42px}
.info{flex:1;min-width:0}
.name{font-family:'Black Han Sans',sans-serif;font-size:22px;line-height:0.95;text-transform:uppercase;color:var(--accent);letter-spacing:0.5px}
.price{font-size:26px;font-weight:900;color:#fbbf24;line-height:1;text-align:right}
.price small{display:block;font-size:11px;color:#8a7280;font-weight:700;margin-top:2px}
.tags{margin-top:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.tag{font-size:10px;font-weight:900;padding:6px 12px;border-radius:20px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.08);color:#bba0b0}
.tag.main{background:var(--accent);color:#000;border-color:var(--accent)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn-ver{padding:12px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.3);color:#c4b5ff;border-radius:12px;font-weight:800;font-size:12px;cursor:pointer}
.btn-buy{padding:12px;background:var(--accent);color:#000;border:none;border-radius:12px;font-weight:900;font-size:12px;cursor:pointer;text-align:center;text-decoration:none}

.ip-box{max-width:520px;margin:24px auto 14px;background:#1a0e1a;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:14px}
.ip-title{text-align:center;color:#f87171;font-weight:800;font-size:10px;letter-spacing:3px}
.ip-line{display:flex;justify-content:space-between;align-items:center;background:#0c0509;padding:12px 14px;border-radius:10px;margin-top:10px;border:1px solid rgba(255,255,255,0.06);font-family:monospace;font-size:13px}
.warn{max-width:520px;margin:14px auto;background:#2a0a0a;border:1px solid #5a1a1a;border-radius:12px;padding:12px;text-align:center;color:#fecaca;font-size:12px;font-weight:700}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#fbbf24;color:#000;padding:10px 18px;border-radius:10px;font-weight:900;font-size:13px;display:none;z-index:9999}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(14px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal.active{display:flex}
.modal-box{width:100%;max-width:420px;background:#140a14;border:1.5px solid #a855f7;border-radius:20px;padding:24px;text-align:center;box-shadow:0 0 40px rgba(168,85,247,0.3);animation:pop 0.3s}
@keyframes pop{from{transform:scale(0.85);opacity:0}to{transform:scale(1);opacity:1}}
.modal-list{text-align:left;margin-top:18px}
.modal-list div{padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.06);font-size:15px;font-weight:600;display:flex;gap:10px}
.modal-list div span{color:#555}
</style>
</head>
<body>
<div class="bg"></div><div class="blob b1"></div><div class="blob b2"></div>

<div class="header">
<h1>ASTRAL<br>SMP</h1>
<div class="pill">✦ TIENDA OFICIAL • TEMPORADA 3 ✦</div>
</div>

<div class="tabs">
<button class="tab-btn active" onclick="switchTab('rangos')">RANGOS</button>
<button class="tab-btn" onclick="switchTab('unbans')">UNBANS</button>
</div>

<div id="rangos" class="list-box active"></div>
<div id="unbans" class="list-box"></div>

<div class="ip-box">
<div class="ip-title">TEMPORADA 3</div>
<div class="ip-line"><span>209.133.215.154</span><button onclick="copyText('209.133.215.154')" style="background:#dc2626;color:white;border:none;padding:7px 12px;border-radius:8px;font-weight:800;cursor:pointer">COPIAR IP</button></div>
<div class="ip-line"><span>50063</span><button onclick="copyText('50063')" style="background:#dc2626;color:white;border:none;padding:7px 12px;border-radius:8px;font-weight:800;cursor:pointer">COPIAR PUERTO</button></div>
</div>

<div class="warn">⛔ ADVERTENCIA: Los rangos solo se hacen con <b>jereklein</b>. No pagues a nadie más.</div>
<div class="toast" id="toast"></div>

<div class="modal" id="modal" onclick="if(event.target==this)closeModal()">
<div class="modal-box">
<div style="font-size:62px" id="mIcon">👑</div>
<div style="font-family:'Black Han Sans';font-size:28px;margin:8px 0 4px" id="mTitle">KIT ASTRAL</div>
<div style="color:#fbbf24;font-size:22px;font-weight:900" id="mPrice">$14 USD</div>
<div class="modal-list" id="mList"></div>
<a href="https://discord.gg/Py2YZaG8sW" target="_blank" style="display:block;width:100%;background:linear-gradient(90deg,#ef4444,#a855f7);color:white;padding:14px;border-radius:12px;font-weight:900;margin-top:18px;text-decoration:none">COMPRAR EN DISCORD</a>
<button style="width:100%;background:transparent;border:1px solid rgba(255,255,255,0.08);color:#9ca3af;padding:12px;border-radius:12px;margin-top:10px;font-weight:700;cursor:pointer" onclick="closeModal()">CERRAR</button>
</div>
</div>

<script>
const rangosData=[
{icon:'👑',name:'KIT PERSONALIZADO',accent:'#fbbf24',price:25,tags:['MEJOR KIT','PERSONALIZABLE','2 TEMP'],list:['Rango Personalizado','Prot a elección','Filo a elección','Kit único']},
{icon:'☄️',name:'KIT ASTRAL',accent:'#ff4de1',price:14,tags:['POPULAR','PROT 18','20M/DIA'],list:['Rango Astral','Prot 18','Filo 18','20M cada día']},
{icon:'🌌',name:'KIT QUASAR',accent:'#a78bfa',price:8,tags:['EQUILIBRADO','PROT 16','15M/DIA'],list:['Rango Quasar','Prot 16','Filo 16','15M cada día']},
{icon:'💫',name:'KIT NOVA',accent:'#38bdf8',price:4,tags:['STARTER','PROT 14','10M/DIA'],list:['Rango Nova','Prot 14','Filo 14','10M cada día']},
];
const unbansData=[
{icon:'🔓',name:'UNBAN 30 DIAS',accent:'#22c55e',price:2,tags:['TEMPORAL'],list:['Desbaneo 30 días','Vuelve a jugar']},
{icon:'♾️',name:'UNBAN PERMANENTE',accent:'#06b6d4',price:6,tags:['PERMANENTE'],list:['Desbaneo permanente','Para siempre']},
];
function render(){
document.getElementById('rangos').innerHTML=rangosData.map((k,i)=>`
<div class="card" style="--accent:${k.accent}">
<div class="card-top">
<div class="icon">${k.icon}</div>
<div class="info"><div class="name">${k.name.replace('KIT ','KIT<br>')}</div><div class="tags">${k.tags.map((t,j)=>`<span class="tag ${j==0?'main':''}">${t}</span>`).join('')}</div></div>
<div class="price">$${k.price}<small>USD</small></div>
</div>
<div class="actions"><button class="btn-ver" onclick="openModal(${i},'rangos')">VER</button><a class="btn-buy" style="background:${k.accent}" href="https://discord.gg/Py2YZaG8sW" target="_blank">COMPRAR</a></div>
</div>`).join('');
document.getElementById('unbans').innerHTML=unbansData.map((k,i)=>`
<div class="card" style="--accent:${k.accent}">
<div class="card-top"><div class="icon">${k.icon}</div><div class="info"><div class="name">${k.name}</div><div class="tags">${k.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div><div class="price">$${k.price}<small>USD</small></div></div>
<div class="actions"><button class="btn-ver" onclick="openModal(${i},'unbans')">VER</button><a class="btn-buy" style="background:${k.accent}" href="https://discord.gg/Py2YZaG8sW" target="_blank">COMPRAR</a></div>
</div>`).join('');
}
render();
function switchTab(id){
document.getElementById('rangos').classList.toggle('active',id==='rangos');
document.getElementById('unbans').classList.toggle('active',id==='unbans');
document.querySelectorAll('.tab-btn').forEach((b,idx)=>{b.classList.toggle('active',(idx===0&&id==='rangos')||(idx===1&&id==='unbans'))});
}
function copyText(t){
if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>toast('Copiado: '+t));}
else{let ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copiado: '+t);}catch(e){toast('Error al copiar');}document.body.removeChild(ta);}
}
function toast(m){let el=document.getElementById('toast');el.innerText=m;el.style.display='block';setTimeout(()=>el.style.display='none',2000);}
function openModal(i,type){
let k=type==='rangos'?rangosData[i]:unbansData[i];
document.getElementById('mIcon').innerText=k.icon;
document.getElementById('mTitle').innerText=k.name;
document.getElementById('mPrice').innerText='$'+k.price+' USD';
document.getElementById('mList').innerHTML=k.list.map(x=>`<div><span>✔</span> ${x}</div>`).join('');
document.getElementById('modal').classList.add('active');
}
function closeModal(){document.getElementById('modal').classList.remove('active');}
</script>
</body>
</html>
