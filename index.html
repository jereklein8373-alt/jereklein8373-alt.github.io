<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astral SMP</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Inter:wght@700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0e0612;color:white;font-family:'Inter',sans-serif;padding:12px;min-height:100vh;position:relative;overflow-x:hidden}

/* FONDO VIOLETA DIFUMINADO CON ROJO - NO TAPA CLICS */
.bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 20% 0%,#4a1860 0%,#1d0a2e 35%,#0a040c 100%);pointer-events:none}
.blob{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:-1}
.b1{width:700px;height:700px;background:radial-gradient(circle,#ff1a4d 0%,#a51cff 60%);top:-200px;left:-200px;opacity:0.65;animation:float1 8s infinite alternate}
.b2{width:600px;height:600px;background:radial-gradient(circle,#d946ef 0%,#ff1744 70%);bottom:-180px;right:-180px;opacity:0.6;animation:float2 9s infinite alternate}
.b3{width:400px;height:400px;background:radial-gradient(circle,#7c3aed 0%,#ff2d95 100%);top:40%;left:30%;opacity:0.3;filter:blur(100px)}
@keyframes float1{from{transform:translate(0,0)}to{transform:translate(40px,30px)}}
@keyframes float2{from{transform:translate(0,0)}to{transform:translate(-30px,-40px)}}

.header{text-align:center;margin:18px 0 8px;position:relative;z-index:10}
.header h1{font-family:'Black Han Sans',sans-serif;font-size:68px;line-height:0.82;text-transform:uppercase;color:#ffd6e7;text-shadow:0 4px 0 #000,0 0 20px #ff2d95}
.pill{margin-top:12px;display:inline-flex;padding:9px 20px;border-radius:30px;background:rgba(255,45,149,0.2);border:1px solid rgba(255,45,149,0.4);font-size:11px;letter-spacing:2.5px;font-weight:900;color:#ff8fbf;box-shadow:0 0 15px rgba(255,45,149,0.3)}

.tabs{max-width:520px;margin:18px auto;display:flex;gap:12px;position:relative;z-index:10}
.tab-btn{flex:1;padding:15px;border-radius:14px;border:1.5px solid rgba(255,255,255,0.15);background:rgba(35,18,45,0.8);backdrop-filter:blur(10px);color:#ff9ec8;font-weight:900;font-size:13px;cursor:pointer;transition:0.2s}
.tab-btn.active{background:linear-gradient(90deg,#ff1a4d,#b026ff);color:white;border-color:#ff1a4d;box-shadow:0 0 20px rgba(255,26,77,0.6);transform:scale(1.02)}

.list-box{max-width:520px;margin:0 auto;display:none;flex-direction:column;gap:16px;position:relative;z-index:10}
.list-box.active{display:flex}

.card{background:linear-gradient(180deg,rgba(58,26,54,0.95),rgba(33,16,42,0.95));backdrop-filter:blur(15px);border:1.5px solid rgba(255,60,150,0.25);border-radius:22px;padding:16px;transition:all 0.25s ease;cursor:pointer;position:relative}
.card::before{content:'';position:absolute;inset:0;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,0.08),transparent);pointer-events:none}
.card:hover{border-color:rgba(255,45,149,0.6);box-shadow:0 0 0 1px rgba(255,45,149,0.3),0 10px 30px rgba(0,0,0,0.6),0 0 30px rgba(255,45,149,0.2);transform:translateY(-3px)}
.card:active{transform:translateY(0px) scale(0.97);box-shadow:0 0 0 1px rgba(255,45,149,0.5),0 0 25px var(--accent);border-color:var(--accent)}
.card-top{display:flex;gap:14px;align-items:center;position:relative;z-index:1}
.icon{width:90px;height:90px;flex-shrink:0;background:radial-gradient(circle at 30% 30%,#4a2140,#1a0a1a);border:1.5px solid rgba(255,80,180,0.3);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:46px;transition:0.25s;box-shadow:0 6px 15px rgba(0,0,0,0.6)}
.card:hover .icon{transform:scale(1.05);box-shadow:0 0 20px var(--accent);border-color:var(--accent)}
.info{flex:1}
.name{font-family:'Black Han Sans',sans-serif;font-size:24px;line-height:0.9;text-transform:uppercase;color:var(--accent);text-shadow:0 2px 0 #000}
.price{font-size:28px;font-weight:900;color:#ffbe0b;text-align:right;text-shadow:0 2px 0 #000}
.price small{display:block;font-size:11px;color:#ff8f8f}
.kit-list{margin-top:14px;background:rgba(0,0,0,0.35);border:1px solid rgba(255,60,150,0.12);border-radius:12px;padding:8px 14px;position:relative;z-index:1}
