<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astral SMP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07030a;color:white;font-family:sans-serif;padding:10px;min-height:100vh;position:relative;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at top,#2a0a18 0%,#150810 45%,#07030a 100%)}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:0.55;animation:float 12s infinite ease-in-out}
.b1{width:600px;height:600px;background:radial-gradient(circle,#7f1d1d,#4c1d95);top:-150px;left:-150px}
.b2{width:500px;height:500px;background:radial-gradient(circle,#a855f7,#7f1d1d);bottom:-150px;right:-150px}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-20px) scale(1.15)}}

.header{text-align:center;margin:28px 0 8px}
.header h1{font-size:62px;font-weight:900;letter-spacing:10px;line-height:1;text-transform:uppercase;background:linear-gradient(180deg,#fff 0%,#ffb3c0 50%,#a855f7 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 12px #dc2626) drop-shadow(0 0 35px #7c3aed);animation:titleGlow 2s infinite alternate}
.header .sub{margin-top:10px;display:inline-block;padding:7px 18px;border:1px solid #3a1a2a;border-radius:20px;background:rgba(255,255,255,0.04);backdrop-filter:blur(10px);font-size:11px;letter-spacing:3px;color:#f9a8d4;font-weight:700}
.header .sub2{margin-top:8px;color:#6b7280;font-size:10px;letter-spacing:2px}
@keyframes titleGlow{from{filter:drop-shadow(0 0 10px #dc2626) drop-shadow(0 0 20px #7c3aed)}to{filter:drop-shadow(0 0 20px #ff4444) drop-shadow(0 0 45px #a855f7)}}

.tabs{max-width:900px;margin:22px auto;display:flex;gap:12px}
.tab-btn{flex:1;padding:16px;border-radius:16px;border:1px solid #2a1a2a;background:rgba(20,8,15,0.85);backdrop-filter:blur(10px);color:#8b7a8a;font-weight:800;font-size:14px;letter-spacing:1px;cursor:pointer;transition:0.2s}
.tab-btn.active{background:linear-gradient(90deg,#dc2626,#a855f7);color:white;box-shadow:0 8px 25px rgba(220,38,38,0.45);border-color:transparent}

.list-box{max-width:900px;margin:0 auto;display:none;flex-direction:column;gap:18px}
.list-box.active{display:flex}

.kit-row{display:flex;align-items:center;gap:22px;padding:26px 22px;background:linear-gradient(90deg,rgba(45,18,25,0.95),rgba(30,12,35,0.95));border:1px solid rgba(255,255,255,0.06);border-radius:22px;backdrop-filter:blur(16px);transition:0.25s;position:relative}
.kit-row:hover{transform:translateY(-3px);border-color:rgba(255,255,255,0.12);box-shadow:0 18px 40px rgba(0,0,0,0.5)}
.kit-row:active{transform:scale(0.97)}
.kit-icon{width:96px;height:96px;background:linear-gradient(180deg,rgba(255,255,255,0.08),rgba(0,0,0,0.4));border:1px solid rgba(255,255,255,0.1);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:48px;flex-shrink:0;box-shadow:inset 0 1px 1px rgba(255,255,255,0.1),0 10px 20px rgba(0,0,0,0.3)}
.kit-info{flex:1;min-width:0}
.kit-name{font-size:22px;font-weight:900;letter-spacing:0.5px;line-height:1.1;color:#fff}
.kit-name span{color:var(--accent)}
.kit-badges{display:flex;gap:6px;margin:8px 0 6px;flex-wrap:wrap}
.badge{font-size:9px;font-weight:800;padding:4px 8px;border-radius:20px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:#cbd5e1;letter-spacing:0.5px}
.badge.accent{background:var(--accent);color:white;border-color:var(--accent);box-shadow:0 0 12px var(--accent)}
.kit-desc{font-size:13px;color:#a89aaa;line-height:1.4;margin-top:2px}
.kit-desc b{color:#e5c9c9;font-weight:700}
.kit-price{font-size:22px;font-weight:900;color:#fbbf24;min-width:110px;text-align:right;line-height:1}
.kit-price small{display:block;font-size:10px;color:#8b7a8a;font-weight:600;letter-spacing:1px;margin-top:2px}
.kit-actions{display:flex;flex-direction:column;gap:8px;flex-shrink:0;width:132px}
.btn-ver{padding:11px;border:1px solid rgba(255,255,255,0.12);color:#d8b4fe;background:rgba(0,0,0,0.25);border-radius:11px;font-weight:800;font-size:12px;cursor:pointer;letter-spacing:0.5px;transition:0.2s}
.btn-buy{padding:12px;background:var(--accent);color:white;border:none;border-radius:11px;font-weight:900;font-size:12px;cursor:pointer;text-decoration:none;text-align:center;letter-spacing:0.5px;box-shadow:0 6px 20px rgba(0,0,0,0.4);transition:0.2s}
.btn-ver:hover{background:rgba(255,255,255,0.08)}
.btn-buy:hover{filter:brightness(1.15);transform:translateY(-1px)}

.ip-box{max-width:900px;margin:32px auto 14px;background:rgba(18,8,14,0.9);border:1px solid rgba(255,255,255,0.06);border-radius:18px;padding:18px;text-align:center;backdrop-filter:blur(12px)}
.ip-box-title{color:#f87171;font-weight:800;font-size:12px;letter-spacing:3px}
.ip-line{display:flex;justify-content:space-between;align-items:center;background:#0a0408;padding:14px 16px;border-radius:12px;margin-top:10px;border:1px solid rgba(255,255,255,0.06);font-family:monospace;font-size:14px}
.warn{max-width:900px;margin:18px auto;background:linear-gradient(90deg,#2a0a0a,#4a1010);border:1px solid #7f1d1d;border-radius:14px;padding:16px;text-align:center;color:#fecaca;font-size:14px;font-weight:700;line-height:1.4;animation:warnPulse 1.2s infinite alternate}
@keyframes warnPulse{from{box-shadow:0 0 0 rgba(239,68,68,0)}to{box-shadow:0 0 25px rgba(239,68,68,0.35)}}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(14px);z-index:999;align-items:center;justify-content:center;padding:20px}
.modal.active{display:flex}
.modal-box{background:linear-gradient(180deg,#23101a,#12080e);border:1px solid rgba(255,255,255,0.1);border-radius:22px;padding:26px;max-width:440px;width:100%;text-align:center;animation:pop 0.35s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="bg"></div><div class="blob b1"></div><div class="blob b2"></div>

<div class="header">
<h1>ASTRAL SMP</h1>
<div class="sub">✦ TIENDA OFICIAL • TEMPORADA 3 ✦</div>
<div class="sub2">LOS MEJORES KITS • ENTREGA INSTANTANEA</div>
</div>

<div class="tabs">
<button class="tab-btn active" onclick="showTab('rangos',this)">RANGOS</button>
<button class="tab-btn" onclick="showTab('unbans',this)">UNBANS</button>
</div>

<div id="rangos" class="list-box active"></div>
<div id="unbans" class="list-box"></div>

<div class="ip-box">
<div class="ip-box-title">TEMPORADA 3 • CONECTATE AHORA</div>
<div class="ip-line"><span>209.133.215.154</span><button onclick="copy('209.133.215.154')" style="background:#dc2626;color:white;border:none;padding:8px 14px;border-radius:9px;font-weight:800">COPIAR IP</button></div>
<div class="ip-line"><span>50063</span><button onclick="copy('50063')" style="background:#dc2626;color:white;border:none;padding:8px 14px;border-radius:9px;font-weight:800">COPIAR PUERTO</button></div>
</div>

<div class="warn">⛔ ADVERTENCIA: Los rangos solo se hacen con <b>jereklein</b>. No pagues a nadie más. Si te estafan no es responsabilidad de Astral.</div>

<div class="modal" id="modal" onclick="if(event.target==this)closeModal()">
<div class="modal-box" id="mBox">
<div style="font-size:68px" id="mIcon">👑</div>
<div style="font-size:28px;font-weight:900;margin:10px 0" id="mTitle"></div>
<div style="color:#fbbf24;font-size:24px;font-weight:900" id="mPrice"></div>
<div id="mList" style="margin-top:14px;text-align:left"></div>
<a href="https://discord.gg/Py2YZaG8sW" target="_blank" style="display:block;width:100%;background:linear-gradient(90deg,#dc2626,#a855f7);color:white;padding:15px;border-radius:12px;font-weight:900;margin-top:16px;text-decoration:none">COMPRAR EN DISCORD</a>
<button style="width:100%;background:transparent;border:1px solid #2a1a2a;color:#9ca3af;padding:13px;border-radius:12px;margin-top:10px;font-weight:700" onclick="closeModal()">CERRAR</button>
</div>
</div>

<script>
const rangos=[
{icon:'👑',name1:'KIT',name2:' PERSONALIZADO',desc:'El mejor de todos • <b>Todo a tu elección</b> • Armadura, filo y kit único creado para vos',price:'$5',usd:'USD',badges:['MEJOR KIT','PERSONALIZABLE','2 TEMP'],accent:'#fbbf24',stats:['👑 Rango Personalizado en el servidor','🛡️ Armadura completa a elección (Prot a elección)','⚔️ Espada Afilado a elección','📦 Kit único personalizado solo para vos','⏳ Duración máxima: 2 temporadas']},
{icon:'☄️',name1:'KIT',name2:' ASTRAL',desc:'Rango Astral • <b>Protección 18</b> • <b>Filo 18</b> • Kit diario + <b>20M</b> cada 24h',price:'$14',usd:'USD',badges:['POPULAR','P18','20M/DIA'],accent:'#ff4de1',stats:['🏷️ Rango Astral','🛡️ Armadura Protección 18','⚔️ Afilado 18','📦 Kit reclamable cada 1 día','💰 20 Millones cada 1 día']},
{icon:'🌌',name1:'KIT',name2:' QUASAR',desc:'Poder Galáctico • <b>Protección 16</b> • <b>Filo 16</b> • Kit diario + <b>15M</b> cada 24h',price:'$8',usd:'USD',badges:['EQUILIBRADO','P16','15M/DIA'],accent:'#a78bfa',stats:['🏷️ Rango Quasar','🛡️ Protección 16','⚔️ Filo 16','💰 15M cada día']},
{icon:'💫',name1:'KIT',name2:' NOVA',desc:'Explosión Estelar • <b>Protección 14</b> • <b>Filo 14</b> • Ideal para empezar • <b>10M</b> cada día',price:'$4',usd:'USD',badges:['STARTER','P14','10M/DIA'],accent:'#38bdf8',stats:['🏷️ Rango Nova','🛡️ Protección 14','⚔️ Filo 14','💰 10M cada día']},
];
const unbans=[
{icon:'🔓',name1:'UNBAN',name2:' 30 DIAS',desc:'Desbaneo temporal • Vuelve al servidor por 30 días',price:'$2',usd:'USD',badges:['TEMPORAL'],accent:'#22c55e',stats:['✅ Desbaneo 30 días','🎮 Vuelve a jugar']},
{icon:'♾️',name1:'UNBAN',name2:' PERMA',desc:'Desbaneo para siempre • Una sola vez y nunca más pagas',price:'$6',usd:'USD',badges:['PERMANENTE','MEJOR VALOR'],accent:'#06b6d4',stats:['♾️ Desbaneo permanente','🎮 Nunca más pagas']},
];
function render(){
document.getElementById('rangos').innerHTML=rangos.map((k,i)=>`
<div class="kit-row" style="--accent:${k.accent}">
<div class="kit-icon">${k.icon}</div>
<div class="kit-info">
<div class="kit-name">${k.name1}<span style="color:${k.accent}">${k.name2}</span></div>
<div class="kit-badges">${k.badges.map((b,j)=>`<span class="badge ${j==0?'accent':''}" style="${j==0?`background:${k.accent};border-color:${k.accent}`:''}">${b}</span>`).join('')}</div>
<div class="kit-desc">${k.desc}</div>
</div>
<div class="kit-price">${k.price}<small>${k.usd}</small></div>
<div class="kit-actions">
<button class="btn-ver" style="--accent:${k.accent}" onclick="openR(${i})">VER</button>
<a class="btn-buy" style="background:${k.accent};${k.accent=='#fbbf24'?'color:black':''}" href="https://discord.gg/Py2YZaG8sW" target="_blank">COMPRAR</a>
</div>
</div>`).join('');
document.getElementById('unbans').innerHTML=unbans.map((k,i)=>`
<div class="kit-row" style="--accent:${k.accent}">
<div class="kit-icon">${k.icon}</div>
<div class="kit-info"><div class="kit-name">${k.name1}<span style="color:${k.accent}">${k.name2}</span></div><div class="kit-badges">${k.badges.map(b=>`<span class="badge">${b}</span>`).join('')}</div><div class="kit-desc">${k.desc}</div></div>
<div class="kit-price">${k.price}<small>${k.usd}</small></div>
<div class="kit-actions"><button class="btn-ver" onclick="openU(${i})">VER</button><a class="btn-buy" style="background:${k.accent}" href="https://discord.gg/Py2YZaG8sW" target="_blank">COMPRAR</a></div>
</div>`).join('');
}
render();
function showTab(id,btn){document.querySelectorAll('.list-box').forEach(g=>g.classList.remove('active'));document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.getElementById(id).classList.add('active');btn.classList.add('active');if(navigator.vibrate) navigator.vibrate(20)}
function copy(t){navigator.clipboard.writeText(t);alert('Copiado: '+t)}
function openR(i){open(rangos[i])}
function openU(i){open(unbans[i])}
function open(k){
document.getElementById('mIcon').innerText=k.icon;
document.getElementById('mTitle').innerHTML=k.name1+`<span style="color:${k.accent}">${k.name2}</span>`;
document.getElementById('mPrice').innerText=k.price+' '+k.usd;
document.getElementById('mBox').style.borderColor=k.accent;
document.getElementById('mList').innerHTML=k.stats.map(x=>`<div style="padding:11px 0;border-bottom:1px solid rgba(255,255,255,0.06);font-size:13px">✔️ ${x}</div>`).join('');
document.getElementById('modal').classList.add('active');
if(navigator.vibrate) navigator.vibrate(40);
}
function closeModal(){document.getElementById('modal').classList.remove('active')}
</script>
</body>
</html>
