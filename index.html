<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tienda Oficial de Astral SMP</title><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0614;color:white;font-family:'Inter',sans-serif;text-align:center} .bg{position:fixed;inset:0;background:radial-gradient(ellipse at 20% 10%,#6d28d9 0%,#4c1d95 15%,#1a0b2e 40%,#06030f 70%);z-index:-2} .hero-title{font-family:'Orbitron';font-size:36px;font-weight:900;margin:30px 10px 10px;color:white;text-shadow:0 0 20px #a855f7} .grid{max-width:1150px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;padding:0 12px} .card{background:rgba(20,10,40,0.9);border:1px solid #a855f7;border-radius:18px;padding:16px} .card.gold{border-color:gold} .card.red{border-color:#ef4444} .card.purple{border-color:#a78bfa} .card.green{border-color:#10b981} .kit-content{display:flex;gap:10px;background:rgba(0,0,0,0.5);border-radius:12px;padding:10px;text-align:left} .kit-text{flex:1;font-size:11px;line-height:1.6;color:#d1c7ff} .kit-img{width:65px;min-width:65px;height:65px;background:rgba(168,85,247,0.15);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px;align-self:center} .price{font-family:'Orbitron';font-size:20px;font-weight:900;margin:10px 0} .btn{width:100%;display:block;padding:11px;border-radius:10px;text-decoration:none;font-weight:900;font-family:'Orbitron';font-size:11px} .btn-gold{background:gold;color:black} .btn-red{background:#dc2626;color:white} .btn-purple{background:#7c3aed;color:white} .btn-green{background:#059669;color:white}
