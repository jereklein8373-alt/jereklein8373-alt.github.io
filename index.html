<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astral SMP</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Inter:wght@600;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07040a;color:white;font-family:'Inter',sans-serif;padding:10px;min-height:100vh;position:relative}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at top,#28101a 0%,#120810 50%,#07040a 100%)}
.blob{position:fixed;border-radius:50%;filter:blur(75px);opacity:0.5}
.b1{width:550px;height:550px;background:radial-gradient(circle,#7f1d1d,#4c1d95);top:-150px;left:-120px}
.b2{width:480px;height:480px;background:radial-gradient(circle,#a855f7,#7f1d1d);bottom:-120px;right:-120px}

.header{text-align:center;margin:28px 0 6px}
.header h1{font-family:'Black Han Sans',sans-serif;font-size:64px;line-height:0.85;letter-spacing:2px;text-transform:uppercase;color:#fff;text-shadow:0 0 0 #fff,0 0 20px #ff4d6d,0 0 45px #a855f7,0 2px 0 #000}
.header h1 span{display:block}
.header h1 span:last-child{color:#c084fc}
.header .pill{margin-top:14px;display:inline-block;padding:8px 20px;border-radius:30px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);font-size:11px;letter-spacing:3px;font-weight:800;color:#f9a8d4}

.tabs{max-width:860px;margin:20px auto;display:flex;gap:12px}
.tab-btn{flex:1;padding:15px;border-radius:14px;border:1px solid rgba(255,255,255,0.06);background:rgba(20,8,15,0.9);color:#8a7a8a;font-weight:800;font-size:14px;cursor:pointer}
.tab-btn.active{background:linear-gradient(90deg,#dc2626,#a855f7);color:white;box-shadow:0 8px 24px rgba(220,38,38,0.35)}

.list-box{max-width:860px;margin:0 auto;display:none;flex-direction:column;gap:14px}
.list-box.active{display:flex}

.kit-row{display:grid;grid-template-columns:86px 1fr 100px 120px;align-items:center;gap:16px;padding:18px 18px;background:linear-gradient(90deg,rgba(42,18,24,0.95),rgba(28,12,32,0.95));border:1px solid rgba(255,255,255,0.07);border-radius:20px;transition:0.2s}
.kit-row:hover{border-color:rgba(255,255,255,0.14);transform:translateY(-2px)}
.kit-row:active{transform:scale(0.98)}
.kit-icon{width:86px;height:86px;background:linear-gradient(180deg,rgba(255,255,255,0.07),rgba(0,0,0,0.4));border:1px solid rgba(255,255,255,0.08);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:42px}
.kit-info{min-width:0}
.kit-name{font-size:17px;font-weight:800;line-height:1.15;text-transform:uppercase}
.kit-name b{color:var(--accent)}
.kit-meta{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}
.tag{font-size:9px;font-weight:800;padding:4px 8px;border-radius:20px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:#b8a0b0}
.tag.main{background:var(--accent);color:#000;border-color:var(--accent)}
.kit-desc{font-size:12px;color:#9a8a9a;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kit-price{font-size:19px;font-weight:900;color:#fbbf24;text-align:right}
.kit-price small{display:block;font-size:10px;color:#7a6a7a}
.kit-actions{display:flex;flex-direction:column;gap:7px}
.btn-ver{padding:10px;border:1px solid rgba(255,255,255,0.12);background:rgba(0,0,0,0.25);color:#c4b5ff;border-radius:10px;font-weight:800;font-size:11px;cursor:pointer}
.btn-buy{padding:11px;background:var(--accent);color:#000;border:none;border-radius:10px;font-weight:900;font-size:11px;cursor:pointer;text-align:center;text-decoration:none}

.ip-box{max-width:860px;margin:28px auto 14px;background:rgba(18,8,14,0.95);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:16px}
.ip-title{text-align:center;color:#f87171;font-weight:800;font-size:11px;letter-spacing:3px;margin-bottom:6px}
.ip-line{display:flex;justify-content:space-between;align-items:center;background:#0c0509;padding:12px 14px;border-radius:10px;margin-top:8px;border:1px solid rgba(255,255,255,0.06);font-family:monospace;font-size:13px}
.warn{max-width:860px;margin:16px auto;background:#2a0a0a;border:1px solid #5a1a1a;border-radius:12px;padding:14px;text-align:center;color:#fecaca;font-size:13px;font-weight:700;animation:pulse 1.1s infinite alternate}
@keyframes pulse{from{opacity:0.9}to{opacity:1;box-shadow:0 0 20px rgba(220,38,38,0.3)}}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(12px);z-index:999;align-items:center;justify-content:center;padding:20px}
.modal.active{display:flex}
.modal-box{background:#1a0e16;border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:24px;max-width:400px;width:100%;text-align:center}
@media(max-width:700px){
.kit-row{grid-template-columns:72px 1fr 80px 100px;gap:10px;padding:14px}
.kit-icon{width:72px;height:72px;font-size:36px}
.kit-name{font-size:14px}
.kit-desc{font-size:11px}
}
</style>
</head>
<body>
<div class="bg"></div><div class="blob b1"></div><div class="blob b2"></div>

<div class="header">
<h1><span>ASTRAL</span><span>SMP</span></h1>
<div class="pill">✦ TIENDA OFICIAL • TEMPORADA 3 ✦</div>
</div>

<div class="tabs">
<button class="tab-btn active" onclick="showTab('rangos',this)">RANGOS</button>
<button class="tab-btn" onclick="showTab('unbans',this)">UNBANS</button>
</div>

<div id="rangos" class="list-box active"></div>
<div id="unbans" class="list-box"></div>

<div class="ip-box">
<div class="ip-title">TEMPORADA 3</div>
<div class="ip-line"><span>209.133.215.154</span><button onclick="copy('209.133.215.154')" style="background:#dc2626;color:white;border:none;padding:7px 12px;border-radius:8px;font-weight:800">COPIAR IP</button></div>
<div class="ip-line"><span>50063</span><button onclick="copy('50063')" style="background:#dc2626;color:white;border:none;padding:7px 12px;border-radius:8px;font-weight:800">COPIAR PUERTO</button></div>
</div>

<div class="warn">⛔ ADVERTENCIA: Los rangos solo se hacen con <b>jereklein</b>. No pagues a nadie más.</div>

<div class="modal" id="modal" onclick="if(event.target==this)closeModal()">
<div class="modal-box" id="mBox">
<div style="font-size:60px" id="mIcon">👑</div>
<div style="font-size:24px;font-weight:900;margin:8px 0" id="mTitle"></div>
<div style="color:#fbbf24;font-size:20px;font-weight:900" id="mPrice"></div>
<div id="mList" style="margin-top:12px;text-align:left"></div>
<a href="https://discord.gg/Py2YZaG8sW" target="_blank" style="display:block;width:100%;background:linear-gradient(90deg,#dc2626,#a855f7);color:white;padding:13px;border-radius:10px;font-weight:900;margin-top:14px;text-decoration:none">COMPRAR EN DISCORD</a>
<button style="width:100%;background:transparent;border:1px solid #2a1a2a;color:#9ca3af;padding:11px;border-radius:10px;margin-top:8px" onclick="closeModal()">CERRAR</button>
</div>
</div>

<script>
const rangos=[
{icon:'👑',name:'KIT PERSONALIZADO',accent:'#fbbf24',price:'$5',desc:'Todo a elección • Kit único',tags:['MEJOR KIT','PERSONALIZABLE'],stats:['Rango Personalizado','Armadura a elección','Filo a elección','Kit único']},
{icon:'☄️',name:'KIT ASTRAL',accent:'#ff4de1',price:'$14',desc:'Protección 18 • Filo 18 • 20M cada día',tags:['POPULAR','P18'],stats:['Rango Astral','Prot 18','Filo 18','20M cada día']},
{icon:'🌌',name:'KIT QUASAR',accent:'#a78bfa',price:'$8',desc:'Protección 16 • Filo 16 • 15M cada día',tags:['EQUILIBRADO','P16'],stats:['Rango Quasar','Prot 16','Filo 16','15M cada día']},
{icon:'💫',name:'KIT NOVA',accent:'#38bdf8',price:'$4',desc:'Protección 14 • Filo 14 • 10M cada día',tags:['STARTER','P14'],stats:['Rango Nova','Prot 14','Filo 14','10M cada día']},
];
const unbans=[
{icon:'🔓',name:'UNBAN 30 DIAS',accent:'#22c55e',price:'$2',desc:'Desbaneo 30 días',tags:['TEMP'],stats:['Desbaneo 30 días']},
{icon:'♾️',name:'UNBAN PERMA',accent:'#06b6d4',price:'$6',desc:'Desbaneo permanente',tags:['PERMA'],stats:['Desbaneo permanente']},
];
function render(){
document.getElementById('rangos').innerHTML=rangos.map((k,i)=>`
<div class="kit-row" style="--accent:${k.accent}">
<div class="kit-icon">${k.icon}</div>
<div class="kit-info"><div class="kit-name"><b style="color:${k.accent}">${k.name}</b></div><div class="kit-meta">${k.tags.map((t,j)=>`<span class="tag ${j==0?'main':''}" style="${j==0?`background:${k.accent}`:''}">${t}</span>`).join('')}</div><div class="kit-desc">${k.desc}</div></div>
<div class="kit-price">${k.price}<small>USD</small></div>
<div class="kit-actions"><button class="btn-ver" onclick="openR(${i})">VER</button><a class="btn-buy" style="background:${k.accent}" href="https://discord.gg/Py2YZaG8sW" target="_blank">COMPRAR</a></div>
</div>`).join('');
document.getElementById('unbans').innerHTML=unbans.map((k,i)=>`
<div class="kit-row" style="--accent:${k.accent}">
<div class="kit-icon">${k.icon}</div>
<div class="kit-info"><div class="kit-name"><b style="color:${k.accent}">${k.name}</b></div><div class="kit-meta">${k.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="kit-desc">${k.desc}</div></div>
<div class="kit-price">${k.price}<small>USD</small></div>
<div class="kit-actions"><button class="btn-ver" onclick="openU(${i})">VER</button><a class="btn-buy" style="background:${k.accent}" href="https://discord.gg/Py2YZaG8sW" target="_blank">COMPRAR</a></div>
</div>`).join('');
}
render();
function showTab(id,btn){document.querySelectorAll('.list-box').forEach(g=>g.classList.remove('active'));document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.getElementById(id).classList.add('active');btn.classList.add('active')}
function copy(t){navigator.clipboard.writeText(t);alert('Copiado: '+t)}
function openR(i){open(rangos[i])}
function openU(i){open(unbans[i])}
function open(k){document.getElementById('mIcon').innerText=k.icon;document.getElementById('mTitle').innerText=k.name;document.getElementById('mPrice').innerText=k.price+' USD';document.getElementById('mBox').style.borderColor=k.accent;document.getElementById('mList').innerHTML=k.stats.map(x=>'<div style="padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.06)">✔️ '+x+'</div>').join('');document.getElementById('modal').classList.add('active')}
function closeModal(){document.getElementById('modal').classList.remove('active')}
</script>
</body>
</html>
